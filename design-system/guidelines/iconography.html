<!-- @dsCard group="Brand" viewport="700x150" name="Iconography — Lucide" subtitle="Outline line icons, ~2px, currentColor" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>body{margin:0;padding:26px 28px;background:var(--background-primary)}
.row{display:flex;gap:26px;align-items:center;color:var(--text-primary)}
.row i{width:26px;height:26px}
.cap{margin-top:16px;font:var(--weight-medium) 13px var(--font-sans);color:var(--text-secondary)}</style></head>
<body>
<div class="row">
<i data-lucide="arrow-right"></i><i data-lucide="trending-up"></i><i data-lucide="search"></i>
<i data-lucide="star"></i><i data-lucide="bar-chart-3"></i><i data-lucide="target"></i>
<i data-lucide="megaphone"></i><i data-lucide="package"></i><i data-lucide="check-circle"></i>
<i data-lucide="settings"></i><i data-lucide="users"></i><i data-lucide="download"></i>
</div>
<p class="cap"><b style="color:var(--text-primary)">Lucide</b> — outline, ~2px stroke, round caps, currentColor. No emoji, no filled/duotone icons. <em>(Substitute set — flagged; swap if Olifant adopts a custom set.)</em></p>
<script>lucide.createIcons();</script>
</body></html>
