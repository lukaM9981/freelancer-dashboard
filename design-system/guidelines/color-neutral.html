<!-- @dsCard group="Colors" viewport="700x150" name="Neutral — ink & off-white" subtitle="Warm grey ramp #FFFEF9 → #0F0B08" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--background-primary)}
.ramp{display:flex;border-radius:var(--radius-sm);overflow:hidden;box-shadow:inset 0 0 0 1px var(--border-subtle)}
.sw{flex:1;height:84px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
.sw span{font:var(--weight-medium) 10px var(--font-mono)}
.cap{margin-top:10px;font:var(--weight-medium) 13px var(--font-sans);color:var(--text-secondary)}
.cap b{color:var(--text-primary);font-weight:700}</style></head>
<body>
<div class="ramp">
<div class="sw" style="background:var(--neutral-50)"><span style="color:#19130D">50</span></div>
<div class="sw" style="background:var(--neutral-100)"><span style="color:#19130D">100</span></div>
<div class="sw" style="background:var(--neutral-200)"><span style="color:#19130D">200</span></div>
<div class="sw" style="background:var(--neutral-300)"><span style="color:#19130D">300</span></div>
<div class="sw" style="background:var(--neutral-400)"><span style="color:#19130D">400</span></div>
<div class="sw" style="background:var(--neutral-500)"><span style="color:#FFFEF9">500</span></div>
<div class="sw" style="background:var(--neutral-600)"><span style="color:#FFFEF9">600</span></div>
<div class="sw" style="background:var(--neutral-700)"><span style="color:#FFFEF9">700</span></div>
<div class="sw" style="background:var(--neutral-800)"><span style="color:#FFFEF9">800</span></div>
<div class="sw" style="background:var(--neutral-900)"><span style="color:#FFFEF9">900</span></div>
<div class="sw" style="background:var(--neutral-950)"><span style="color:#FFFEF9">950</span></div>
</div>
<p class="cap"><b>50 = off-white page · 950 = ink text.</b> Warm (browned) greys, never cold blue-grey. 900 is body text.</p>
</body></html>
