<!-- @dsCard group="Colors" viewport="700x150" name="Pine — accent" subtitle="#D0E0C9 accent · green ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--background-primary)}
.ramp{display:flex;border-radius:var(--radius-sm);overflow:hidden;box-shadow:inset 0 0 0 1px var(--border-subtle)}
.sw{flex:1;height:84px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
.sw span{font:var(--weight-medium) 10px var(--font-mono)}
.cap{margin-top:10px;font:var(--weight-medium) 13px var(--font-sans);color:var(--text-secondary)}
.cap b{color:var(--text-primary);font-weight:700}</style></head>
<body>
<div class="ramp">
<div class="sw" style="background:var(--pine-50)"><span style="color:#172013">50</span></div>
<div class="sw" style="background:var(--pine-100)"><span style="color:#172013">100</span></div>
<div class="sw" style="background:var(--pine-200);outline:2px solid var(--neutral-900);outline-offset:-2px"><span style="color:#172013">200★</span></div>
<div class="sw" style="background:var(--pine-300)"><span style="color:#172013">300</span></div>
<div class="sw" style="background:var(--pine-400)"><span style="color:#172013">400</span></div>
<div class="sw" style="background:var(--pine-500)"><span style="color:#FFFEF9">500</span></div>
<div class="sw" style="background:var(--pine-600)"><span style="color:#FFFEF9">600</span></div>
<div class="sw" style="background:var(--pine-700)"><span style="color:#FFFEF9">700</span></div>
<div class="sw" style="background:var(--pine-800)"><span style="color:#FFFEF9">800</span></div>
<div class="sw" style="background:var(--pine-900)"><span style="color:#FFFEF9">900</span></div>
<div class="sw" style="background:var(--pine-950)"><span style="color:#FFFEF9">950</span></div>
</div>
<p class="cap"><b>★ #D0E0C9 — brand accent.</b> Quiet secondary — subtle backgrounds, case-study callouts, accent text (700).</p>
</body></html>
