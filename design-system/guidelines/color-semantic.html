<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — status" subtitle="Success · Error · Info triads" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--background-primary)}
.wrap{display:flex;gap:24px}
.grp{flex:1}
.glbl{font:var(--weight-bold) 11px var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--text-secondary);margin:0 0 8px}
.row{display:flex;gap:8px}
.sw{flex:1;height:56px;border-radius:var(--radius-xs);display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;box-shadow:inset 0 0 0 1px rgba(25,19,13,.08)}
.sw span{font:10px var(--font-mono)}</style></head>
<body>
<div class="wrap">
<div class="grp"><p class="glbl">Success</p><div class="row">
<div class="sw" style="background:var(--green-50)"><span>50</span></div>
<div class="sw" style="background:var(--green-200)"><span>200</span></div>
<div class="sw" style="background:var(--green-500)"><span style="color:#fff">500</span></div>
<div class="sw" style="background:var(--green-700)"><span style="color:#fff">700</span></div>
</div></div>
<div class="grp"><p class="glbl">Error</p><div class="row">
<div class="sw" style="background:var(--red-50)"><span>50</span></div>
<div class="sw" style="background:var(--red-200)"><span>200</span></div>
<div class="sw" style="background:var(--red-600)"><span style="color:#fff">600</span></div>
</div></div>
<div class="grp"><p class="glbl">Info</p><div class="row">
<div class="sw" style="background:var(--blue-100)"><span>100</span></div>
<div class="sw" style="background:var(--blue-700)"><span style="color:#fff">700</span></div>
</div></div>
</div>
</body></html>
