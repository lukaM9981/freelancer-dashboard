<!-- @dsCard group="Colors" viewport="700x150" name="Yellow — brand" subtitle="#FFD046 primary · 11-step ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--background-primary)}
.ramp{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;box-shadow:inset 0 0 0 1px var(--border-subtle)}
.sw{flex:1;height:84px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
.sw span{font:var(--weight-medium) 10px var(--font-mono);}
.cap{margin-top:10px;font:var(--weight-medium) 13px var(--font-sans);color:var(--text-secondary)}
.cap b{color:var(--text-primary);font-weight:700}</style></head>
<body>
<div class="ramp">
<div class="sw" style="background:var(--yellow-50)"><span style="color:#332600">50</span></div>
<div class="sw" style="background:var(--yellow-100)"><span style="color:#332600">100</span></div>
<div class="sw" style="background:var(--yellow-200)"><span style="color:#332600">200</span></div>
<div class="sw" style="background:var(--yellow-300)"><span style="color:#332600">300</span></div>
<div class="sw" style="background:var(--yellow-400);outline:2px solid var(--neutral-900);outline-offset:-2px"><span style="color:#332600">400★</span></div>
<div class="sw" style="background:var(--yellow-500)"><span style="color:#332600">500</span></div>
<div class="sw" style="background:var(--yellow-600)"><span style="color:#FFFEF9">600</span></div>
<div class="sw" style="background:var(--yellow-700)"><span style="color:#FFFEF9">700</span></div>
<div class="sw" style="background:var(--yellow-800)"><span style="color:#FFFEF9">800</span></div>
<div class="sw" style="background:var(--yellow-900)"><span style="color:#FFFEF9">900</span></div>
<div class="sw" style="background:var(--yellow-950)"><span style="color:#FFFEF9">950</span></div>
</div>
<p class="cap"><b>★ #FFD046 — brand primary.</b> Used for primary actions, highlights, the brand badge. Ink text on yellow.</p>
</body></html>
