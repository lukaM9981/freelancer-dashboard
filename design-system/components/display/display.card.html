<!-- @dsCard group="Components" viewport="700x440" name="Cards, Stats & Badges" subtitle="Content cards, big-number stats, status labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 28px; background: var(--background-primary); }
  .lbl { font: var(--weight-bold) 12px var(--font-sans); letter-spacing: 2px; text-transform: uppercase; color: var(--text-secondary); margin: 0 0 12px; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, StatCard, Badge, Tag, Avatar } = window.OlifantDigitalDesignSystem_8e3542;
function Demo(){
  return (
    <div>
      <p className="lbl">Cards</p>
      <div className="cards">
        <Card variant="bordered">
          <Badge variant="brand" size="sm">Article</Badge>
          <h4 style={{fontFamily:"var(--font-serif)",fontSize:"20px",lineHeight:"26px",margin:"12px 0 8px"}}>How design systems accelerate product</h4>
          <p style={{fontSize:"14px",color:"var(--text-secondary)",margin:0}}>A well-built system is the foundation of every great product.</p>
        </Card>
        <StatCard value="247%" label="Conversion increase" trend="vs. previous quarter" />
        <Card variant="accent">
          <Badge variant="accent" size="sm">Case Study</Badge>
          <h4 style={{fontFamily:"var(--font-serif)",fontSize:"20px",lineHeight:"26px",margin:"12px 0 8px"}}>Rebranding a fintech challenger</h4>
          <p style={{fontSize:"14px",color:"var(--text-secondary)",margin:"0 0 10px"}}>12-week brand &amp; product sprint.</p>
          <span style={{fontWeight:700,color:"var(--pine-700)"}}>+180% Revenue</span>
        </Card>
        <Card variant="inverse">
          <span style={{display:"inline-flex",width:36,height:36,borderRadius:"999px",background:"var(--yellow-400)",alignItems:"center",justifyContent:"center",color:"#19130D"}}><i data-lucide="star" style={{width:18,height:18}}></i></span>
          <h4 style={{fontFamily:"var(--font-serif)",fontSize:"20px",lineHeight:"26px",margin:"12px 0 8px",color:"var(--text-inverse)"}}>Brand Identity</h4>
          <p style={{fontSize:"14px",color:"var(--neutral-300)",margin:0}}>Systems built to scale across every touchpoint.</p>
        </Card>
      </div>
      <p className="lbl">Badges, Tags &amp; Avatars</p>
      <div className="row">
        <Badge variant="default">Default</Badge>
        <Badge variant="brand">Brand</Badge>
        <Badge variant="success">Success</Badge>
        <Badge variant="error">Error</Badge>
        <Badge variant="info">Info</Badge>
        <Badge variant="accent">Accent</Badge>
        <Tag>Amazon PPC</Tag>
        <Tag variant="brand" removable onRemove={()=>{}}>SEO</Tag>
        <Avatar name="Jane Doe" />
        <Avatar name="Olifant Team" size="sm" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
setTimeout(()=>window.lucide&&window.lucide.createIcons(),100);
</script>
</body>
</html>
