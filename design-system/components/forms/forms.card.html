<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 28px; background: var(--background-primary); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 22px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 560px; }
  .lbl { font: var(--weight-bold) 12px var(--font-sans); letter-spacing: 2px; text-transform: uppercase; color: var(--text-secondary); margin: 0 0 12px; }
  .sec { margin-bottom: 30px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Input, Select, Checkbox, Radio, Switch } = window.OlifantDigitalDesignSystem_8e3542;
function Demo() {
  const [on, setOn] = React.useState(true);
  const [chk, setChk] = React.useState(true);
  return (
    <div>
      <div className="sec">
        <p className="lbl">Buttons</p>
        <div className="row">
          <Button variant="primary" size="lg">Get Started</Button>
          <Button variant="secondary">Get Started</Button>
          <Button variant="tertiary">Get Started</Button>
          <Button variant="primary" loading>Saving</Button>
          <Button variant="primary" disabled>Get Started</Button>
        </div>
        <div className="row">
          <Button variant="primary" size="sm" iconRight={<i data-lucide="arrow-right" style={{width:16,height:16}}></i>}>Start</Button>
          <IconButton label="Menu" variant="tertiary"><i data-lucide="menu" style={{width:18,height:18}}></i></IconButton>
          <IconButton label="Next" variant="primary"><i data-lucide="arrow-right" style={{width:18,height:18}}></i></IconButton>
          <IconButton label="More" variant="secondary"><i data-lucide="more-horizontal" style={{width:18,height:18}}></i></IconButton>
        </div>
      </div>
      <div className="sec">
        <p className="lbl">Inputs</p>
        <div className="grid2">
          <Input label="Email address" placeholder="Enter your email" helperText="We'll never share your email." />
          <Input label="Email address" defaultValue="jane@olifant.co" state="error" errorText="Please enter a valid email address." />
          <Select label="Service" defaultValue="amazon"><option value="amazon">Amazon advertising</option><option value="brand">Brand strategy</option></Select>
          <Input label="Search" iconLeft={<i data-lucide="search" style={{width:18,height:18}}></i>} placeholder="Search campaigns" />
        </div>
      </div>
      <div className="sec">
        <p className="lbl">Controls</p>
        <div className="row">
          <Checkbox label="Accept terms" checked={chk} onChange={()=>setChk(!chk)} />
          <Checkbox label="Indeterminate" indeterminate />
          <Radio label="Monthly" name="plan" checked />
          <Radio label="Annual" name="plan" />
          <Switch label="Enable notifications" checked={on} onChange={()=>setOn(!on)} />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
setTimeout(() => window.lucide && window.lucide.createIcons(), 100);
</script>
</body>
</html>
